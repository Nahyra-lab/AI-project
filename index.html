<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success Book | Accueil</title>
    <!-- Importation des polices : Great Vibes (calligraphie) + Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #001f3f, #003366, #000080);
            color: white;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- RIDEAU BLEU THÉÂTRE (VOTRE IMAGE) --- */
        #curtain-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            z-index: 9999;
            overflow: hidden;
            background: #000;
        }
        .curtain-side {
            width: 50%;
            height: 100%;
            /* Intégration de votre image avec un léger filtre d'ombre pour accentuer le réalisme */
            background-image: linear-gradient(to right, rgba(0,0,0,0.4), rgba(255,255,255,0.05), rgba(0,0,0,0.4)), 
                              url("https://img.freepik.com/vecteurs-libre/rideau-bleu-ferme-theatre-cinema-scene_107791-25192.jpg");
            background-size: 200% 100%; /* Permet de diviser l'image proprement en deux */
            background-repeat: no-repeat;
            transition: transform 2.2s cubic-bezier(0.77, 0, 0.18, 1);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.6);
            position: absolute;
            top: 0;
        }
        
        /* Ajustement des moitiés gauche et droite de l'image */
        .left { 
            left: 0; 
            background-position: left center; 
            border-right: 1px solid rgba(255,255,255,0.1); 
        }
        .right { 
            right: 0; 
            background-position: right center; 
            border-left: 1px solid rgba(255,255,255,0.1); 
        }

        /* Animation d'ouverture */
        #curtain-container.opened .left { transform: translateX(-100%); }
        #curtain-container.opened .right { transform: translateX(100%); }

        /* Contenu textuel sur le rideau */
        .curtain-content {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%,-50%);
            text-align: center;
            z-index: 10000;
            transition: opacity 0.8s ease;
            width: 100%;
        }
        .curtain-text {
            font-family: 'Great Vibes', cursive;
            font-size: 6.5rem;
            color: #fceabb;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.6), 0 0 30px rgba(252, 234, 187, 0.4);
            margin-bottom: 35px;
        }
        #open-btn {
            padding: 16px 45px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #6a5acd, #00bcd4);
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }
        #open-btn:hover { 
            transform: scale(1.08); 
            box-shadow: 0 10px 30px rgba(0, 188, 212, 0.4);
        }

        /* --- EFFET PLUIE D'ÉTOILES FILANTES --- */
        .star-field { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
        .star { position: absolute; background-color: white; border-radius: 50%; animation: fall linear infinite; box-shadow: 0 0 8px white; }
        @keyframes fall {
            0% { transform: translateY(-20px) scale(0); opacity: 0; }
            10% { opacity: 1; transform: translateY(10vh) scale(1); }
            90% { opacity: 1; }
            100% { transform: translateY(105vh) scale(0.5); opacity: 0; }
        }

        /* --- MENU DE SÉLECTION (Contenu caché derrière) --- */
        .selection-menu { position: relative; z-index: 10; text-align: center; max-width: 900px; padding: 2rem; }
        .selection-title { font-size: 2.5rem; margin-bottom: 3rem; font-weight: 600; letter-spacing: 1px; }
        .choices-container { display: flex; gap: 3rem; justify-content: center; flex-wrap: wrap; }
        
        .choice-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 25px;
            padding: 45px 30px;
            width: 320px;
            text-decoration: none;
            color: white;
            transition: transform 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }
        .choice-card:hover {
            transform: translateY(-10px);
            border-color: #fceabb;
            box-shadow: 0 15px 35px rgba(248, 181, 0, 0.25);
        }
        .choice-card h2 { font-size: 2rem; margin-bottom: 15px; color: #fceabb; font-family: 'Poppins', sans-serif; }
        .choice-card p { font-size: 0.95rem; color: rgba(255,255,255,0.75); line-height: 1.6; }
    </style>
</head>
<body>

    <!-- Structure du Rideau -->
    <div id="curtain-container">
        <div class="curtain-side left"></div>
        <div class="curtain-side right"></div>
        <div class="curtain-content">
            <h1 class="curtain-text">Succes Book</h1>
            <button id="open-btn">OPEN</button>
        </div>
    </div>

    <!-- Le conteneur pour la pluie d'étoiles -->
    <div class="star-field" id="star-field"></div>

    <!-- Menu des choix (Yearbook / Success Story) -->
    <div class="selection-menu">
        <h1 class="selection-title">Choisissez votre univers</h1>
        <div class="choices-container">
            <a href="yearbook.html" class="choice-card">
                <h2>Yearbook</h2>
                <p>Revivez les éclats de rire, les souvenirs partagés et laissez une trace dans notre Livre d'Or personnalisé.</p>
            </a>
            <a href="SUCCESS.html" class="choice-card">
                <h2>Success Story</h2>
                <p>Explorez les profils brillants, parcours inspirants et perspectives d'avenir de la promotion.</p>
            </a>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const curtain = document.getElementById('curtain-container');
            const openBtn = document.getElementById('open-btn');
            const content = document.querySelector('.curtain-content');
            const starField = document.getElementById('star-field');

            // Vérifie si le rideau a déjà été ouvert durant la navigation
            if (sessionStorage.getItem('mainCurtainOpened') === 'true') {
                curtain.style.display = 'none';
                startStarRain();
            }

            if (openBtn) {
                openBtn.addEventListener('click', () => {
                    curtain.classList.add('opened');
                    if(content) content.style.opacity = "0";
                    sessionStorage.setItem('mainCurtainOpened', 'true');

                    // On retire le rideau du DOM après l'animation pour pouvoir cliquer sur les cartes
                    setTimeout(() => {
                        curtain.style.display = 'none';
                    }, 2200);

                    startStarRain();
                });
            }

            // Générateur d'étoiles filantes en continu
            function startStarRain() {
                setInterval(() => {
                    const star = document.createElement('div');
                    star.classList.add('star');
                    const size = Math.random() * 3 + 1.5;
                    star.style.width = `${size}px`;
                    star.style.height = `${size}px`;
                    star.style.left = `${Math.random() * 100}vw`;
                    star.style.animationDuration = `${Math.random() * 2 + 1.5}s`;
                    
                    starField.appendChild(star);
                    setTimeout(() => { star.remove(); }, 3500);
                }, 70); 
            }
        });
    </script>
</body>
</html>
