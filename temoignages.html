<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livre d'Or - Yearbook Collège Marie-Anne</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* --- STYLES POUR LE LIVRE D'OR --- */
        .yearbook-wrapper {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .guestbook-section {
            background: #ffffff;
            border: 1px solid rgba(138, 127, 164, 0.15);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.02);
        }

        .guestbook-section h2 {
            font-family: 'Playfair Display', serif;
            color: #8a7fa4;
            text-align: center;
            margin-bottom: 25px;
            font-size: 2rem;
        }

        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; color: #5a5266; }

        .guestbook-input {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(138, 127, 164, 0.25);
            background: #faf9f6;
            color: #4a4357;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            transition: border-color 0.3s ease;
            box-sizing: border-box;
        }

        .guestbook-input:focus { outline: none; border-color: #8a7fa4; background: #ffffff; }

        .anon-checkbox {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
            font-size: 0.9rem;
            color: #5a5266;
            cursor: pointer;
        }

        .submit-btn {
            background: #8a7fa4;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            display: block;
            margin: 20px auto 0;
            box-shadow: 0 4px 12px rgba(138, 127, 164, 0.2);
        }

        .submit-btn:hover { transform: scale(1.05); box-shadow: 0 6px 18px rgba(138, 127, 164, 0.35); }

        #comments-display { margin-top: 30px; display: flex; flex-direction: column; gap: 15px; }

        .comment-card {
            background: #faf9f6;
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid #8a7fa4;
            text-align: left;
            box-shadow: 0 2px 8px rgba(0,0,0,0.01);
        }

        .comment-card strong { color: #8a7fa4; font-size: 1rem; }
        .comment-card small { color: #9a90ab; float: right; }
        .comment-card p { margin-top: 8px; font-size: 0.95rem; color: #4a4357; line-height: 1.5; }
    </style>
</head>
<body>

    <nav class="navbar" style="display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; background: #ffffff; border-bottom: 1px solid rgba(138, 127, 164, 0.1); position: sticky; top: 0; z-index: 1000;">
        <div class="logo">
            <a href="index.html" style="font-family: 'Playfair Display', serif; font-size: 1.5rem; color: #8a7fa4; text-decoration: none; font-weight: bold;">Our Yearbook</a>
        </div>
        <ul class="nav-links" style="display: flex; list-style: none; gap: 30px; align-items: center;">
            <li><a href="index.html" style="color: #4a4357; text-decoration: none; font-weight: 500;">Accueil</a></li>
            <li><a href="temoignages.html" style="color: #8a7fa4; text-decoration: none; font-weight: 600;">Livre d'Or ✨</a></li>
            <li class="dropdown" style="position: relative;">
                <a href="#" style="color: #4a4357; text-decoration: none; font-weight: 500; transition: 0.3s;">Événements ▼</a>
                <div class="dropdown-content" style="display: none; position: absolute; background: #ffffff; min-width: 200px; border-radius: 12px; top: 100%; left: 0; padding: 10px; box-shadow: 0 8px 25px rgba(138, 127, 164, 0.15); border: 1px solid rgba(138, 127, 164, 0.1);">
                    <a href="philosophie.html" style="color: #4a4357; display: block; padding: 10px; text-decoration: none; border-radius: 8px;">Philosophes</a>
                    <a href="noel.html" style="color: #4a4357; display: block; padding: 10px; text-decoration: none; border-radius: 8px;">Noël Enchanté</a>
                    <a href="carnaval.html" style="color: #4a4357; display: block; padding: 10px; text-decoration: none; border-radius: 8px;">Carnaval</a>
                    <a href="foire.html" style="color: #4a4357; display: block; padding: 10px; text-decoration: none; border-radius: 8px;">La Foire annuelle</a>
                </div>
            </li>
            <li><a href="SUCCESS.html" style="color: #4a4357; text-decoration: none; font-weight: 500; transition: 0.3s;">Success Story</a></li>
        </ul>
    </nav>

    <div class="yearbook-wrapper">
        <div class="guestbook-section">
            <h2>Livre d'Or &amp; Témoignages</h2>
            <p style="text-align: center; color: #7a708a; margin-bottom: 30px;">Partagez un souvenir, un message ou un mot doux pour la postérité !</p>
            
            <form id="feedback-form">
                <div class="form-group">
                    <label for="user-name">Votre Nom &amp; Prénom :</label>
                    <input type="text" id="user-name" class="guestbook-input" placeholder="Ex: Claire Heureuse...">
                </div>
                
                <div class="form-group">
                    <label for="user-message">Votre Message ou Souvenir :</label>
                    <textarea id="user-message" class="guestbook-input" rows="4" placeholder="Laissez un message mémorable pour l'année..." required></textarea>
                </div>

                <label class="anon-checkbox">
                    <input type="checkbox" id="is-anonymous"> Poster anonymement ✨
                </label>

                <button type="submit" class="submit-btn">Publier le message</button>
            </form>

            <div id="comments-display"></div>
        </div>
    </div>

    <footer>
        <div class="team-container" style="text-align: center; padding: 30px; margin-top: 50px; border-top: 1px dashed rgba(138, 127, 164, 0.3);">
            <p style="font-size: 0.9rem; color: #8a7fa4; letter-spacing: 1px;">Créé avec ♥️ par Marcel Jardlyne, Elga Auguste &amp; Mesidor Carmita</p>
        </div>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Gestion du menu déroulant
            const dropdown = document.querySelector('.dropdown');
            const dropdownContent = document.querySelector('.dropdown-content');
            if (dropdown && dropdownContent) {
                dropdown.addEventListener('mouseenter', () => dropdownContent.style.display = 'block');
                dropdown.addEventListener('mouseleave', () => dropdownContent.style.display = 'none');
            }

            // Système de Livre d'or localisé
            const feedbackForm = document.getElementById('feedback-form');
            const commentsDisplay = document.getElementById('comments-display');

            function loadComments() {
                if (!commentsDisplay) return;
                const comments = JSON.parse(localStorage.getItem('yearbookMsgs')) || [];
                if (comments.length === 0) {
                    commentsDisplay.innerHTML = '<p style="text-align:center; color:#9a90ab;">Aucun témoignage pour l\'instant. Soyez le premier !</p>';
                    return;
                }
                commentsDisplay.innerHTML = comments.map(c => `
                    <div class="comment-card">
                        <small>${c.date}</small>
                        <strong>${c.name}</strong>
                        <p>${c.text}</p>
                    </div>
                `).join('');
            }

            if (feedbackForm) {
                feedbackForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const name = document.getElementById('user-name').value;
                    const text = document.getElementById('user-message').value;
                    const isAnon = document.getElementById('is-anonymous').checked;

                    // Liste étendue des mots grossiers interdits
                    const bannedWords = [
                        "idiot", "stupide", "con", "nul", "merde", "fuck", "bitch", 
                        "putain", "pute", "caca", "salope", "connard", "chier"
                    ];
                    
                    for (let word of bannedWords) {
                        if (text.toLowerCase().includes(word)) {
                            alert("Votre message contient un mot inapproprié ou grossier et ne peut pas être publié.");
                            return;
                        }
                    }

                    const newMsg = {
                        name: (isAnon || name.trim() === "") ? "Anonyme ✨" : name,
                        text: text,
                        date: new Date().toLocaleDateString('fr-FR')
                    };

                    const comments = JSON.parse(localStorage.getItem('yearbookMsgs')) || [];
                    comments.unshift(newMsg);
                    localStorage.setItem('yearbookMsgs', JSON.stringify(comments));
                    feedbackForm.reset();
                    loadComments();
                });
            }

            loadComments();
        });
    </script>
</body>
</html>
