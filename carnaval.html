<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>La Foire - Livre Magique</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* --- CONFIGURATION DU FOND ANIMÉ ET FESTIF --- */
        body.body-foire {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            /* Dégradé de couleurs Carnaval : Violet, Rose néon, Orange feu */
            background: linear-gradient(135deg, #2e1a47, #7209b7, #f72585, #ffb703);
            background-size: 400% 400%;
            animation: carnivalGradient 15s ease infinite;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        /* Animation fluide du fond coloré */
        @keyframes carnivalGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- EFFET VERRE ULTRA-MODERNE POUR LES TITRES --- */
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            max-width: 800px;
            margin: 40px auto;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .gold-text {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            background: linear-gradient(to right, #ffe600, #ffb703, #ffffff, #ffb703);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 0 10px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .glass-card p {
            color: #ffffff;
            font-size: 1.2rem;
            font-weight: 300;
            margin: 0;
            letter-spacing: 1px;
        }

        /* --- STRUCTURE DU LIVRE MAGIQUE 3D --- */
        .book-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            perspective: 2500px; /* Profondeur 3D accentuée */
        }

        .book {
            width: 550px;  
            height: 680px; 
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s;
        }

        .page {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            transform-origin: left center;
            transform-style: preserve-3d;
            transition: transform 1.4s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 1;
        }

        /* Look "Livre de collection" avec texture Parchemin */
        .front, .back {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            /* Couleur papier parchemin noble */
            background: #fcf8f2;
            backface-visibility: hidden;
            box-shadow: inset 4px 0 30px rgba(0, 0, 0, 0.2), 15px 15px 35px rgba(0,0,0,0.5);
            border-radius: 0 24px 24px 0;
            padding: 40px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #e2d4c9;
        }

        /* Couverture extérieure du livre (Page 1 Front) */
        #p1 .front {
            background: linear-gradient(135deg, #4a154b, #2c003e); /* Cuir violet royal */
            border: 4px solid #ffb703; /* Bordure dorée */
            border-radius: 0 24px 24px 0;
        }

        #p1 .front h2 {
            color: #ffb703 !important;
            font-size: 2.5rem;
            text-align: center;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .back {
            transform: rotateY(180deg);
            border-radius: 24px 0 0 24px;
        }

        /* Effet d'ombre réaliste sur la tranche du livre */
        .front::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 25px;
            height: 100%;
            background: linear-gradient(to right, rgba(0,0,0,0.2), transparent);
        }

        .book h2 {
            font-family: 'Playfair Display', serif;
            color: #4a154b;
            margin-top: 0;
            font-size: 1.8rem;
            border-bottom: 2px solid rgba(138, 127, 164, 0.2);
            padding-bottom: 10px;
        }

        /* Conteneurs pour les futures Photos / Vidéos */
        .media-box {
            width: 100%;
            height: 65%;
            border-radius: 12px;
            overflow: hidden;
            background: #111;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            border: 3px solid #ffffff;
        }

        .media-box img, .media-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .page.flipped {
            transform: rotateY(-180deg);
        }

        /* --- BOUTONS TOURNER LA PAGE --- */
        .controls {
            margin-top: 40px;
            display: flex;
            gap: 25px;
        }

        .book-btn {
            background: linear-gradient(135deg, #ffb703, #ff8c00);
            color: #fff;
            border: none;
            padding: 16px 40px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 25px rgba(255, 136, 0, 0.4);
            transition: transform 0.3s, box-shadow 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .book-btn:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 12px 30px rgba(255, 136, 0, 0.6);
        }

        .book-btn:disabled {
            background: rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.4);
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* --- ZONE TEXTE EN DESSOUS --- */
        .description-section {
            max-width: 850px;
            margin: 50px auto;
            padding: 40px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            color: #2c003e;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        .description-section h2 {
            color: #7209b7;
            font-size: 2rem;
            margin-top: 0;
        }
    </style>
</head>
